name: Publish to GitHub Packages

on:
  push:
    branches:
      - master
    tags:
      - 'v*'              # también publica cuando se crea un tag v1.0.0, v1.1.0, etc.
  workflow_dispatch:      # permite disparar manualmente desde GitHub Actions UI

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write     # necesario para publicar en GitHub Packages

    steps:

      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'          # GitHub Actions no tiene Java 25 aún — usar 21 LTS
          distribution: 'temurin'
          cache: maven
          server-id: github           # debe coincidir con el <id> en distributionManagement
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Publicar en GitHub Packages
        run: mvn --batch-mode deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # token automático de GitHub Actions

      - name: Resumen de publicación
        run: |
          echo "✓ reparaya-shared publicado en GitHub Packages"
          echo "  groupId:    pe.edu.reparaya"
          echo "  artifactId: reparaya-shared"
          echo "  version:    $(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          echo ""
          echo "  URL: https://github.com/mazkte/reparaya-shared/packages"
